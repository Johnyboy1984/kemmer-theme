name: Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS theme validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate theme repository
        uses: hacs/action@main
        with:
          category: theme
  contrast:
    name: YAML and text contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.3
      - run: python validate.py
